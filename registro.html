<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="assets/logo.png" type="image/x-icon">
    <title>Registro - Agrimarket</title>
</head>
<body>
<div class="page">

    <!-- HEADER (Tomado del index) -->
    <header>
        <div class="logo"><img src="assets/logo.png" alt="Logo AgriMarket" class="logo"></div>
        <div class="hdr-right">
            <div class="precio"><sup>$</sup>134.000<small>/ cop</small></div>
            <div class="carrito">
                <span>5</span>
                <svg viewBox="0 0 48 48" fill="none" stroke="#222" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h6l5 21h22l5-15H12"/><circle cx="17" cy="40" r="2.5" fill="#222"/><circle cx="33" cy="40" r="2.5" fill="#222"/></svg>
            </div>
            <button class="btn-login"><a href="login.html">Iniciar Sesión</a></button>
            <div class="avatar">
                <svg viewBox="0 0 52 52" fill="none" stroke="#fff" stroke-width="3"><circle cx="26" cy="19" r="8"/><path d="M8 46c0-10 8-15 18-15s18 5 18 15"/></svg>
            </div>
        </div>
    </header>

    <!-- CUERPO DEL REGISTRO -->
    <main class="registro-main">
        <div class="registro-container">
            <form class="registro-form">
                
                <!-- Columna Izquierda -->
                <div class="registro-col">
                    <div class="campo-registro">
                        <label>Nombre(s) *</label>
                        <input type="text" placeholder="Value">
                    </div>
                    <div class="campo-registro">
                        <label>Apellido(s) *</label>
                        <input type="text" placeholder="Value">
                    </div>
                    <div class="campo-registro">
                        <label>Número de celular</label>
                        <input type="text" placeholder="Value">
                    </div>
                </div>

                <!-- Columna Derecha -->
                <div class="registro-col">
                    <div class="campo-registro">
                        <label>Correo electronico *</label>
                        <input type="email" placeholder="Value">
                    </div>
                    <div class="campo-registro">
                        <label>Contraseña *</label>
                        <input type="password" placeholder="Value">
                    </div>
                    <div class="campo-registro">
                        <label>Confirmar contraseña*</label>
                        <input type="password" placeholder="Value">
                    </div>
                </div>

            </form>

            <!-- Fila de abajo (Tipo de documento y dirección) -->
            <div class="registro-bottom">
                <div class="registro-col-izq">
                    <div class="campo-registro">
                        <label>Tipo de documento *</label>
                        <select>
                            <option value="" disabled selected>Value</option>
                            <option value="cc">Cédula de Ciudadanía</option>
                            <option value="ce">Cédula de Extranjería</option>
                            <option value="nit">NIT</option>
                        </select>
                    </div>
                    <div class="campo-registro">
                        <label>Número de documento *</label>
                        <input type="text" placeholder="Value">
                    </div>
                    <div class="campo-registro">
                        <label>Dirección de residencia</label>
                        <input type="text" placeholder="Value">
                    </div>
                </div>
                
                <!-- Botón de Registro -->
                <div class="registro-col-der">
                    <button type="submit" class="btn-registrarse">Registrarse</button>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER (Tomado del index) -->
    <footer></footer>
</div>
</body>
</html>
